<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f4d3f">
  <title>ขอเพลง — ร้านระเบียงบัว ศรีสมาน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/img/lotus.svg" type="image/svg+xml">
  <link rel="manifest" href="request-manifest.json">
  <link rel="apple-touch-icon" href="assets/img/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ขอเพลง">
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="stylesheet" href="assets/css/request.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="request.html"><img src="assets/img/lotus.svg" alt=""><span><b id="shop">ร้านระเบียงบัว ศรีสมาน</b><small>ขอเพลง</small></span></a>
    <button class="btn small hidden" id="installBtn" data-act="install">📲 ติดตั้งแอป</button>
    <button class="btn small hidden" id="meBtn" data-act="profile"></button>
  </header>

  <main class="rq">
    <section class="card now-card" id="nowCard">
      <img id="nowThumb" alt="">
      <div class="now-info">
        <small id="nowLabel">กำลังเล่น</small>
        <b id="nowTitle">กำลังโหลด…</b>
        <span id="nowBy" class="muted small-text"></span>
        <div class="pbar"><i id="nowBar"></i></div>
      </div>
    </section>

    <section class="card staff-ctl hidden" id="staffCtl">
      <button class="btn" data-act="toggle" id="playBtn">⏸ หยุด</button>
      <button class="btn" data-act="skip">⏭ ข้าม</button>
      <label class="vol">🔈<input type="range" min="0" max="100" step="5" id="vol"><span id="volText"></span></label>
      <span class="small-text" id="playerState"></span>
    </section>

    <div class="banner warn hidden" id="closed">ตอนนี้ปิดรับขอเพลงชั่วคราว</div>

    <section class="card search-card" id="searchCard">
      <form id="searchForm" class="search-row">
        <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="ค้นหาชื่อเพลง / ศิลปิน">
        <button class="btn primary" type="submit">ค้นหา</button>
      </form>
      <p class="small-text muted hint" id="hint"></p>
      <div id="results" class="results"></div>
    </section>

    <section class="card lib-card hidden" id="libCard">
      <button class="lib-head" data-act="libToggle" id="libHead">
        <span>📁 รายชื่อเพลงในร้าน <small class="muted" id="libCount"></small></span><span class="lib-arrow" id="libArrow">ดูทั้งหมด ▾</span>
      </button>
      <div id="libBody" class="hidden">
        <div id="libList" class="lib-list"></div>
        <button class="btn hidden" data-act="libMore" id="libMore">โหลดเพิ่ม</button>
      </div>
    </section>

    <section>
      <h3 class="sec-title">คิวเพลง <small class="muted" id="qCount"></small></h3>
      <ol id="queue" class="qlist"></ol>
    </section>

    <section id="histSec" class="hidden">
      <h3 class="sec-title">เพิ่งเล่นไป</h3>
      <ol id="history" class="qlist hist"></ol>
    </section>

    <section class="card staff-set hidden" id="staffSet"></section>

    <footer class="rq-foot">
      <button class="btn small" data-act="staff" id="staffBtn">สำหรับพนักงาน</button>
    </footer>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-box rq-modal" id="modalBox"></div></div>
  <div id="toast" class="toast"></div>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/jukebox.js"></script>
  <script src="assets/js/request.js"></script>
</body>
</html>
