<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระเบียงบัว — ระบบจอ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/img/lotus.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/admin.css">
  <style>
    .hero { max-width: 960px; margin: 0 auto; padding: 40px 24px 20px; text-align: center; }
    .hero img { width: 84px; height: 84px; }
    .hero h1 { font-size: 34px; margin-top: 10px; }
    .hero p { color: var(--muted); margin: 8px 0 18px; }
    .resume { max-width: 960px; margin: 0 auto 16px; padding: 0 24px; }
    .resume .banner { justify-content: center; font-size: 18px; }
    h3.sub { max-width: 960px; margin: 0 auto 12px; padding: 0 24px; }
    .tvs { max-width: 960px; margin: 0 auto; padding: 0 24px 48px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .tvs a {
      padding: 22px 16px; text-decoration: none; color: var(--ink);
      display: flex; gap: 10px; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 600; outline: none; border-width: 3px;
    }
    .tvs a svg { width: 26px; height: 26px; }
    .tvs a:hover, .tvs a:focus { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--surface)); transform: scale(1.04); }
    .tvs a.mine::after { content: 'ห้องนี้'; font-size: 12px; font-weight: 500; color: var(--gold); }
    @media (max-width: 640px) { .tvs { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <section class="hero">
    <img src="assets/img/lotus.svg" alt="">
    <h1 id="shop">ระเบียงบัว</h1>
    <p>เลือกห้อง ด้วยปุ่มลูกศรบนรีโมต แล้วกด OK</p>
    <a class="btn" href="admin.html">แผงควบคุม (สำหรับผู้ดูแล)</a>
  </section>
  <div class="resume hidden" id="resume"><div class="banner">กำลังเปิดจอห้อง <b id="resumeRoom"></b> ใน <b id="resumeSec">3</b> วินาที — กดปุ่มใดก็ได้เพื่อเลือกห้องอื่น</div></div>
  <h3 class="sub">เปิดจอของแต่ละห้อง</h3>
  <section class="tvs" id="tvs"></section>
  <script src="assets/js/common.js"></script>
  <script>
    const ROOM_KEY = 'rb_room';
    let saved = null;
    try { saved = localStorage.getItem(ROOM_KEY); } catch (_) {}

    fetch(RB.CONFIG_PATH + '?t=' + Date.now(), { cache: 'no-store' })
      .then(r => r.json()).catch(() => null)
      .then(raw => {
        const cfg = RB.normalize(raw);
        document.getElementById('shop').textContent = cfg.shop.name;
        const box = document.getElementById('tvs');
        box.innerHTML = cfg.screens.concat(cfg.rooms).map(r =>
          `<a class="card${String(r.id) === saved ? ' mine' : ''}" href="tv.html?room=${encodeURIComponent(r.id)}"><svg viewBox="0 0 24 24"><path d="M3 5h18v12H3z M8 21h8 M12 17v4"/></svg>${RB.esc(r.name)}</a>`
        ).join('');
        const tiles = [...box.querySelectorAll('a')];
        (box.querySelector('.mine') || tiles[0]).focus();

        // TV remote: arrow keys move between tiles (browsers on Android boxes have no spatial navigation)
        document.addEventListener('keydown', e => {
          const i = tiles.indexOf(document.activeElement);
          const cols = getComputedStyle(box).gridTemplateColumns.split(' ').length;
          const step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[e.key];
          if (step === undefined) return;
          e.preventDefault();
          const next = tiles[Math.min(tiles.length - 1, Math.max(0, (i < 0 ? 0 : i + step)))];
          next.focus();
        });

        // Remembered room: open it automatically, unless we got here with the Back button
        const nav = performance.getEntriesByType('navigation')[0];
        const cameBack = nav && nav.type === 'back_forward';
        const room = saved && cfg.rooms.find(r => String(r.id) === saved);
        if (!room || cameBack || location.search.includes('pick')) return;
        document.getElementById('resume').classList.remove('hidden');
        document.getElementById('resumeRoom').textContent = room.name;
        let sec = 3;
        const t = setInterval(() => {
          sec--;
          document.getElementById('resumeSec').textContent = sec;
          if (sec <= 0) { clearInterval(t); location.href = 'tv.html?room=' + encodeURIComponent(room.id); }
        }, 1000);
        const cancel = () => { clearInterval(t); document.getElementById('resume').classList.add('hidden'); };
        document.addEventListener('keydown', cancel, { once: true });
        document.addEventListener('pointerdown', cancel, { once: true });
      });
  </script>
</body>
</html>
